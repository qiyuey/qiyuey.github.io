<svg xmlns="http://www.w3.org/2000/svg" width="800" height="730" viewBox="0 0 800 730" role="img" aria-labelledby="title desc">
<title id="title">同一冲击，四种资产反应</title>
<desc id="desc">先辨认增长、通胀或现金需求的变化，再分别看美债收益率、美股盈利与折现率、美元相对利差、黄金实际利率与买盘。每项作用都有适用条件。</desc>
<style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.small{font-size:16px;fill:#475569}.body{font-size:18px}.bold{font-weight:700}</style>
<rect width="800" height="730" rx="20" fill="#f8fafc"/>
<text x="24" y="42" class="bold" font-size="26">同一冲击，四种资产反应</text>
<text x="24" y="74" class="body">先辨认：增长 · 通胀 · 现金需求</text>
<text x="24" y="104" class="small">再看各自的传导渠道；下列关系有条件。</text>
<rect x="24" y="128" width="352" height="218" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="24" y="142" width="4" height="34" rx="2" fill="#245c91"/>
<text x="40" y="164" class="bold" font-size="24">美债</text>
<text x="124" y="163" class="small">看收益率</text>
<text x="40" y="206" class="body">同一只固定利率债券</text>
<text x="40" y="233" class="body">收益率上升 → 价格下降</text>
<path d="M40 252H360" stroke="#e2e8f0"/>
<text x="40" y="281" class="small">长端还看未来利率预期与期限溢价</text>
<text x="40" y="306" class="small">降息不保证长期收益率下降</text>
<rect x="408" y="128" width="352" height="218" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="408" y="142" width="4" height="34" rx="2" fill="#476445"/>
<text x="424" y="164" class="bold" font-size="24">美股</text>
<text x="508" y="163" class="small">看盈利与折现率</text>
<text x="424" y="206" class="body">盈利改善 → 支持股价</text>
<text x="424" y="233" class="body">折现率上升 → 压低估值</text>
<path d="M424 252H744" stroke="#e2e8f0"/>
<text x="424" y="281" class="small">折现率包含无风险利率与风险补偿</text>
<text x="424" y="306" class="small">盈利改善可能抵消利率压力</text>
<rect x="24" y="364" width="352" height="218" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="24" y="378" width="4" height="34" rx="2" fill="#72519a"/>
<text x="40" y="400" class="bold" font-size="24">美元</text>
<text x="124" y="399" class="small">看相对吸引力</text>
<text x="40" y="442" class="body">美国相对海外预期利差扩大</text>
<text x="40" y="469" class="body">→ 通常支持美元</text>
<path d="M40 488H360" stroke="#e2e8f0"/>
<text x="40" y="517" class="small">比较两边的利率，不只看美国</text>
<text x="40" y="542" class="small">危机中还要看美元融资需求</text>
<rect x="408" y="364" width="352" height="218" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="408" y="378" width="4" height="34" rx="2" fill="#8d641b"/>
<text x="424" y="400" class="bold" font-size="24">黄金</text>
<text x="508" y="399" class="small">看实际利率与买盘</text>
<text x="424" y="442" class="body">实际利率上升 → 持有成本增加</text>
<text x="424" y="469" class="body">→ 金价通常承压</text>
<path d="M424 488H744" stroke="#e2e8f0"/>
<text x="424" y="517" class="small">避险与储备买盘可能抵消压力</text>
<text x="424" y="542" class="small">急需现金时，黄金也可能被卖出</text>
<text x="24" y="628" class="bold" font-size="20">分歧不等于主导原因切换</text>
<text x="24" y="658" class="small">同一个冲击，可以让不同资产走向不同方向。</text>
<text x="24" y="683" class="small">先找原因，再用盈利预期与融资压力等证据核对。</text>
</svg>
